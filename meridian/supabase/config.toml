# Local Supabase CLI configuration for Meridian Property Partners.
# See https://supabase.com/docs/guides/local-development/cli/config

project_id = "meridian-property-partners"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "25MiB"

[storage.buckets.listing-images]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.listing-documents]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["application/pdf"]

[storage.buckets.developer-assets]
public = false
file_size_limit = "10MiB"
