name: GentleFlow
options:
  bundleIdPrefix: au.com.gentleflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    ENABLE_PREVIEWS: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  GentleFlow:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GentleFlow
    resources:
      - path: GentleFlow/Resources
    info:
      path: GentleFlow/Supporting/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "Gentle Flow"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUserTrackingUsageDescription: "Gentle Flow does not track you. This is never shown because we do not request tracking."
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
    entitlements:
      path: GentleFlow/Supporting/GentleFlow.entitlements
      properties:
        com.apple.developer.in-app-payments: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.gentleflow.app
        PRODUCT_NAME: "Gentle Flow"
        DEVELOPMENT_ASSET_PATHS: ""
    capabilities:
      - com.apple.InAppPurchase
  GentleFlowTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GentleFlowTests
    dependencies:
      - target: GentleFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.gentleflow.tests

schemes:
  GentleFlow:
    build:
      targets:
        GentleFlow: all
    run:
      config: Debug
      # Local StoreKit testing: lets the paywall show real prices and complete
      # test purchases in the Simulator, before anything exists in App Store
      # Connect. Has no effect on release builds.
      storeKitConfiguration: GentleFlow/Supporting/GentleFlow.storekit
    test:
      config: Debug
      targets:
        - GentleFlowTests
